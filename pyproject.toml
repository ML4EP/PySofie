[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=2.12"]
build-backend = "sofie_build"
backend-path = ["packaging"]

[project]
name = "sofie"
dynamic = ["version"]
description = "Python bindings and parsers for SOFIE: translate Keras, PyTorch and ONNX models to standalone C++ inference code"
readme = "README.md"
license = "LGPL-2.1-only"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "The CERN ML4EP Team" }]
keywords = ["SOFIE", "inference", "code generation", "onnx", "keras", "pytorch", "high energy physics"]
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/ML4EP/PySofie"
Source = "https://github.com/ML4EP/PySofie"
Issues = "https://github.com/ML4EP/PySofie/issues"
SOFIE = "https://github.com/ML4EP/SOFIE"

[project.optional-dependencies]
# the Keras parser
keras = ["numpy", "keras", "tensorflow"]
# the PyTorch parser
torch = ["numpy", "torch>=2.5"]
# all three parsers
full = ["sofie[keras,torch]"]
# everything needed to run the tests
dev = ["sofie[full]", "pytest", "onnx", "onnxscript"]

[tool.scikit-build]
wheel.packages = ["python/sofie"]
# tests and tutorials are not part of a production install; of the SOFIE submodule only the sources
# that are built are, not its tests and benchmarks
sdist.exclude = ["tests", "tutorials", ".github", "benchmark"]
sdist.include = ["SOFIE/core", "SOFIE/parsers", "SOFIE/cmake", "SOFIE/LICENSE", "packaging"]
cmake.version = ">=3.18"

# the version is the one of python/sofie/__init__.py
[[tool.dynamic-metadata]]
field = "version"
provider = "scikit_build_core.metadata.regex"
input = "python/sofie/__init__.py"
regex = '(?i)^__version__ = "(?P<value>[^"]+)"'

[tool.scikit-build.cmake.define]
# SOFIE_SOURCE_DIR defaults to the SOFIE submodule; override with
#   pip install . -C cmake.define.SOFIE_SOURCE_DIR=/path/to/SOFIE

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["sofie_*.py"]
addopts = "--import-mode=importlib"
pythonpath = ["tests/common", "tests/keras/cpu"]
filterwarnings = [
    # torch.export on nn.LSTM / nn.GRU / nn.RNN: torch's own recurrent modules keep a list of plain tensors
    "ignore:The tensor attributes self.module._flat_weights:UserWarning",
    # keras with the TensorFlow backend, converting a tensor with numpy 2 (TensorFlow's __array__ has no copy keyword)
    "ignore:__array__ implementation doesn't accept a copy keyword:DeprecationWarning",
]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_* *-manylinux_i686"
build-frontend = "build"
test-command = "python -c \"import sofie; sofie.RModel('m', 'now')\""

[tool.cibuildwheel.linux]
# C++20 needs a recent compiler
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
