[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sofie-extra-parsers"
version = "0.1.0"
description = "Keras and PyTorch model parsers for TMVA SOFIE, formerly part of ROOT"
readme = "README.md"
license = "LGPL-2.1-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "The ROOT team" }]
# ROOT itself is also required at runtime, but it is not distributed on PyPI.
# It has to be provided by the environment (system package, conda, nix, ...),
# built with PyROOT and TMVA/SOFIE support.
dependencies = ["numpy"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
keras = ["keras", "tensorflow"]
torch = ["torch"]
# onnx 1.19.0 is excluded because of https://github.com/onnx/onnx/issues/7249,
# which breaks the PyTorch parser (torch.onnx imports onnx indirectly).
test = ["pytest", "keras", "tensorflow", "torch", "onnx!=1.19.0"]

[tool.hatch.build.targets.wheel]
packages = ["python/sofie_extra_parsers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The test files were imported from ROOT, where they did not follow the
# pytest test_*.py naming convention.
python_files = ["sofie_*.py"]
