name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # the generation of alpaka code is opt-in; the runner has no GPU, so only the tests that do not
        # run on one (the emitted code, and that it compiles against alpaka and sofieBLAS) apply
        flags: ["", "--alpaka --arch cuda"]
    steps:
      # SOFIE is a git submodule of this repository
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # dev mode installs the system packages (compiler, CMake, BLAS), the CPU-only torch
      # wheels and the test dependencies, and runs every test file in its own pytest process
      - name: Install (dev mode) and run the tests
        run: ./install.sh dev ${{ matrix.flags }}

  prod-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (prod mode)
        run: ./install.sh prod
      - name: The core works without any dependency
        run: |
          python3 -m pip list
          cd /tmp && python3 - <<'PY'
          import sofie, sys
          sofie.RModel("m", "now")
          assert "numpy" not in sys.modules
          # the Keras and PyTorch parsers say which extra to install
          for name, extra in (("pytorch", "torch"), ("keras", "keras")):
              try:
                  getattr(sofie, name).parse("model")
              except ImportError as e:
                  assert f"sofie[{extra}]" in str(e), e
              else:
                  raise AssertionError("expected an ImportError")
          PY
